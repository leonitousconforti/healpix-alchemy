name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork PRs get a read-only token that cannot post comments.
    if: ${{ github.event_name == 'push' || !github.event.pull_request.head.repo.fork }}
    permissions:
      contents: write # push baseline data to the gh-pages branch (main only)
      pull-requests: write # post comparison comments on PRs

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --locked --group test
      - run: uv run --no-sync pytest tests/benchmarks --benchmark-only --benchmark-json benchmark_results.json

      - uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: pytest
          output-file-path: benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Only pushes to main update the stored baseline.
          save-data-file: ${{ github.event_name == 'push' }}
          auto-push: ${{ github.event_name == 'push' }}
          comment-always: ${{ github.event_name == 'pull_request' }}

          # Timings on shared runners are noisy; only flag large regressions.
          alert-threshold: 125%
          fail-on-alert: false
