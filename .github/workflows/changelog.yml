name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ github.head_ref != 'release' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check for changeset
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^\.changeset/.*\.md$'; then
            echo "Changeset found."
          else
            echo "::error::No changeset found. Add one under .changeset/ (see CONTRIBUTING.md) or apply the skip-changelog label."
            exit 1
          fi
