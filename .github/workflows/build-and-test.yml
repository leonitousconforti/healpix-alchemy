name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ty check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    # Use the server started below instead of spawning one per test session:
    # initdb cannot create a data directory under pytest's temporary
    # directories on Windows, because Python 3.12 and later create those with a
    # protected owner-only ACL whose attributes initdb cannot read.
    env:
      POSTGRESQL_NOPROC: "1"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The test databases are disposable, so trade durability for speed, as
      # the postgresql_proc fixture does when it spawns a server itself.
      - name: Start PostgreSQL
        if: ${{ runner.os != 'Windows' }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install postgresql
            # Without a valid locale the postmaster refuses to start.
            export LC_ALL=en_US.UTF-8
          else
            export LC_ALL=C.UTF-8
          fi
          export PATH="$(pg_config --bindir):$PATH"
          initdb -D "$RUNNER_TEMP/pgdata" -U postgres --auth=trust
          pg_ctl -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pgdata.log" \
            -o "-p 5432 -c fsync=off -c synchronous_commit=off -c full_page_writes=off" start

      - name: Start PostgreSQL
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          # PostgreSQL is preinstalled but not on PATH, and its service is
          # disabled, so initialize and start a server of our own. Windows has
          # neither C.UTF-8 nor en_US.UTF-8, so settle for the C locale.
          $env:PATH = "$env:PGBIN;$env:PATH"
          $env:LC_ALL = 'C'
          initdb -D "$env:RUNNER_TEMP\pgdata" -U postgres --auth=trust
          pg_ctl -D "$env:RUNNER_TEMP\pgdata" -l "$env:RUNNER_TEMP\pgdata.log" `
            -o "-p 5432 -c fsync=off -c synchronous_commit=off -c full_page_writes=off" start

      - run: uv sync --locked --group test
      - run: uv run --no-sync pytest --benchmark-skip

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cross-repo PRs get a read-only token that cannot post comments.
    # Compare repo names rather than checking `head.repo.fork`, so that
    # same-repo PRs still run benchmarks when this repo is itself a fork.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write # push baseline data to the gh-pages branch (main only)
      pull-requests: write # post comparison comments on PRs

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --locked --group test
      - run: uv run --no-sync pytest tests/benchmarks --benchmark-only --benchmark-json benchmark_results.json

      - uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: pytest
          output-file-path: benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Only pushes to main update the stored baseline.
          save-data-file: ${{ github.event_name == 'push' }}
          auto-push: ${{ github.event_name == 'push' }}
          comment-always: ${{ github.event_name == 'pull_request' }}

          # Timings on shared runners are noisy; only flag large regressions.
          alert-threshold: 125%
          fail-on-alert: false
