name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ty check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PostgreSQL
        if: ${{ runner.os == 'macOS' }}
        run: brew install postgresql

      - name: Set up PostgreSQL for Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          # PostgreSQL is preinstalled on the Windows runners, but its bin
          # directory is not on PATH, so pytest-postgresql cannot find
          # pg_config to locate pg_ctl.
          $bin = $env:PGBIN
          if (-not $bin -or -not (Test-Path $bin)) {
            $bin = Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $bin) { throw 'Could not find a PostgreSQL bin directory' }
          Write-Host "Using $bin"
          Add-Content $env:GITHUB_PATH $bin

          # Keep the PostgreSQL data directories that pytest-postgresql creates
          # off the system drive, as pytest-postgresql itself does on Windows.
          # Forward slashes because pytest splits PYTEST_ADDOPTS with shlex,
          # which would eat the backslashes.
          $temp = '${{ runner.temp }}'.Replace('\', '/')
          Add-Content $env:GITHUB_ENV "PYTEST_ADDOPTS=--basetemp=$temp/pytest-basetemp"

      - run: uv sync --locked --group test
      - run: uv run --no-sync pytest --benchmark-skip

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cross-repo PRs get a read-only token that cannot post comments.
    # Compare repo names rather than checking `head.repo.fork`, so that
    # same-repo PRs still run benchmarks when this repo is itself a fork.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write # push baseline data to the gh-pages branch (main only)
      pull-requests: write # post comparison comments on PRs

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --locked --group test
      - run: uv run --no-sync pytest tests/benchmarks --benchmark-only --benchmark-json benchmark_results.json

      - uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: pytest
          output-file-path: benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Only pushes to main update the stored baseline.
          save-data-file: ${{ github.event_name == 'push' }}
          auto-push: ${{ github.event_name == 'push' }}
          comment-always: ${{ github.event_name == 'pull_request' }}

          # Timings on shared runners are noisy; only flag large regressions.
          alert-threshold: 125%
          fail-on-alert: false
