[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "healpix-alchemy"
description = "SQLAlchemy extensions for HEALPix spatially indexed astronomy data"
readme = "README.md"
authors = [{ name = "Leo Singer", email = "leo.p.singer@nasa.gov" }]
license = "BSD-3-clause"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Database",
]
dependencies = [
    "astropy",
    "astropy_healpix>=2",
    "mocpy>=0.12.2",
    "sqlalchemy>=2",
]
requires-python = ">=3.11"
dynamic = ["version"]

[project.urls]
source = "https://github.com/skyportal/healpix-alchemy"

[dependency-groups]
dev = ["ruff", "towncrier", "ty"]
test = [
    "astroquery",
    "numpy",
    "pandas",
    "psycopg[binary]",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-doctestplus",
    "pytest-postgresql>=4.0.0",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
addopts = "--doctest-glob *.md"
doctest_plus = true
doctest_optionflags = ["ELLIPSIS", "FLOAT_CMP"]
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]

[tool.ruff.lint]
extend-select = [
    "A",    # shadowing Python builtins
    "ANN",  # require type annotations
    "ARG",  # unused function arguments
    "B",    # bugbear: likely bugs and design problems
    "C4",   # unnecessary comprehensions and generator calls
    "D",    # docstring presence and style
    "DTZ",  # naive (timezone-unaware) datetimes
    "EM",   # string literals directly in raise statements
    "ERA",  # commented-out code
    "EXE",  # shebang and executable-bit consistency
    "FA",   # missing `from __future__ import annotations`
    "FBT",  # boolean positional arguments ("boolean traps")
    "FURB", # modernization refactors
    "I",    # import sorting
    "ICN",  # conventional import aliases (np, pd, ...)
    "INP",  # missing __init__.py in package directories
    "N",    # PEP 8 naming conventions
    "NPY",  # numpy-specific rules
    "PD",   # pandas anti-patterns
    "PERF", # performance anti-patterns
    "PIE",  # misc lints
    "PL",   # pylint
    "PT",   # pytest style
    "PTH",  # os.path calls that should use pathlib
    "RET",  # return statement style
    "RUF",  # ruff-specific rules
    "S",    # security checks
    "SIM",  # simplifiable code
    "SLF",  # private member access on other objects
    "T20",  # stray print statements
    "TID",  # tidy imports
    "TRY",  # exception handling style
    "UP",   # outdated syntax for the minimum Python version
    "W",    # whitespace and deprecation warnings
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "sqlalchemy.orm.declared_attr",
    "sqlalchemy.orm.declared_attr.directive",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/conftest.py" = ["ARG001"]
"tests/**" = ["S101"]

[tool.coverage.run]
omit = ["*/conftest.py", "*/tests/*"]

[tool.towncrier]
directory = "changes.d"
filename = "CHANGES.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/skyportal/healpix-alchemy/pull/{issue})"
ignore = ["README.md"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Other changes"
showcontent = true
